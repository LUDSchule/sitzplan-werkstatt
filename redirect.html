<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung – Sitzplan-Werkstatt</title>
<style>
  body{margin:0; padding:28px; font-family:"Segoe UI",system-ui,sans-serif; color:#4a5768; background:#fafbfc}
  @media (prefers-color-scheme:dark){ body{color:#a6b4c4; background:#12171d} }
</style>
</head>
<body>
<p id="msg">Anmeldung wird abgeschlossen …</p>
<!-- MSAL 5: Diese Seite reicht die Antwort von Microsoft an die App zurück. Nicht umbenennen. -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.22.0/lib/redirect-bridge/msal-redirect-bridge.min.js"></script>
<script>
  msalRedirectBridge.broadcastResponseToMainFrame().catch(function (e) {
    console.error(e);
    document.getElementById("msg").textContent =
      "Die Anmeldung konnte nicht abgeschlossen werden. Dieses Fenster kann geschlossen werden.";
  });
</script>
</body>
</html>
